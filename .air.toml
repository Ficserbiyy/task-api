root = "."
tmp_dir = "tmp"

[build]
# Automatically re-generate Swagger docs before building
pre_cmd = [
  "swag init -d ./,cmd/server,internal/handlers --parseInternal -g cmd/server/main.go",
  "echo 'Swagger docs updated!'"
]
# -buildvcs=false flag here
cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/server"
bin = "tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "docs"]
delay = 1000 # ms

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
